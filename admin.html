<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Placements Simplified</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;700&display=swap" rel="stylesheet" />
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      const script = document.createElement("script");
      script.defer = true;
      script.src = "/_vercel/insights/script.js";
      document.head.appendChild(script);
    </script>
    <script type="module" src="/src/admin.js"></script>
  </head>
  <body class="admin-page">
    <div id="denied-panel" class="denied-wrapper">
      <h2 class="denied-title">Access denied</h2>
      <p class="denied-text">This console is limited to the admin Gmail after sign-in on the main site.</p>
      <a href="/index.html" class="btn">Back to home</a>
    </div>

    <div id="dashboard-panel" class="admin-wrap hidden">
      <div class="dashboard-header">
        <div>
          <a href="/index.html" class="logo"><span>Placements</span> Simplified</a>
          <p class="stat-label">Admin</p>
        </div>
        <div class="header-actions">
          <button id="clear-db-btn" class="btn btn-danger" type="button">Reset local DB</button>
          <a href="/index.html" class="btn btn-primary">Website</a>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-label">Registered users</span>
          <div id="stat-total-users" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <span class="stat-label">Marked online</span>
          <div class="stat-value" id="live-user-count">0</div>
        </div>
        <div class="stat-card">
          <span class="stat-label">Storage</span>
          <div class="stat-value" style="font-size: 1.1rem;">localStorage</div>
        </div>
      </div>

      <div class="table-wrapper">
        <div class="table-controls">
          <input type="search" id="user-search" class="search-input" placeholder="Search name or email" />
          <span id="user-count-display">Showing 0 users</span>
        </div>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Created</th>
                <th>Last sign-in</th>
              </tr>
            </thead>
            <tbody id="user-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
